# 프로젝트 공용 빌드 속성 — 커밋 대상 (비밀 없음).
# 릴리스 서명 값(MYAPP_RELEASE_*)은 사용자 홈 ~/.gradle/gradle.properties 또는
# EAS credentials.json이 담당한다 (app/build.gradle이 findProperty 폴백 처리).

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.daemon=true

android.useAndroidX=true
android.enableJetifier=false

# 에뮬레이터(x86_64)와 실기기(arm64)만 빌드해 시간을 줄인다
reactNativeArchitectures=x86_64,arm64-v8a

newArchEnabled=false
hermesEnabled=true

FLIPPER_VERSION=0.182.0

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
				buildToolsVersion = "35.0.0"
				minSdkVersion = 24
				compileSdkVersion = 35        // Updated
				targetSdkVersion = 35

        // RN 0.76 기본 NDK — 23은 reanimated CMake 구성이 실패한다.
        ndkVersion = "26.1.10909125"

        reactNativeFFmpegPackage = "full-gpl-lts"
        // 16.0.1은 구형 support 라이브러리에 의존해 androidx와 충돌 — androidx 기반 버전으로 상향
        googlePlayServicesAuthVersion = "20.7.0"
        // ✅ Kotlin 버전 업그레이드 (1.8.0 → 1.9.24)
        kotlinVersion = "1.9.24"
        facebookSdkVersion = "13.1.0"

				// ✅ Fresco 버전 전역 설정
        frescoVersion = "3.1.3"
    }
    subprojects { subproject ->
        afterEvaluate{
            if((subproject.plugins.hasPlugin('android') || subproject.plugins.hasPlugin('android-library'))) {
                android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                    buildToolsVersion rootProject.ext.buildToolsVersion
                }
            }
						if (project.hasProperty('android')) {
								android {
										lint {
												disable 'InvalidWakeLockTag'
												abortOnError false
												checkReleaseBuilds false
										}
								}
						}
        }
    }
    repositories {
        // google()
        // mavenCentral()

        google()
        // jcenter()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")

        // classpath("com.android.tools.build:gradle:4.0.1")
				classpath("com.android.tools.build:gradle:8.6.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.3.14")
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        mavenCentral()
        // jcenter()
        gradlePluginPortal()
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://maven.google.com' }
        maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    }

    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.arthenica:ffmpeg-kit-https') using module('io.github.maitrungduc1410:ffmpeg-kit-https:6.0.1')
            substitute module('com.arthenica:ffmpeg-kit-https:6.0-2') using module('io.github.maitrungduc1410:ffmpeg-kit-https:6.0.1')
        }

        // 구형 서포트 라이브러리를 쓰는 모듈이 androidx(core)와 클래스 중복을 일으키므로 제외
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support', module: 'support-media-compat'
    }
}
name: ios-testflight

on:
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # opsRuntimeConfig.js는 생성 파일(커밋 금지)이라 테스트 전에 만들어야 한다
      - name: Generate ops runtime config
        env:
          GREYD_APP_MOBILE_KEY: ${{ secrets.GREYD_APP_MOBILE_KEY }}
        run: node scripts/generate-ops-config.js

      - name: Run regression tests
        run: yarn test --runInBand

      - name: Verify release-critical configuration
        run: yarn verify:release

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 서명 인증서·프로비저닝 프로파일·빌드 번호는 모두 EAS 서버에
      # 저장된 것을 그대로 사용한다 (EXPO_TOKEN만 있으면 됨).
      - name: Build iOS ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # eas-build-pre-install 훅(generate-ops-config.js)이 요구
          GREYD_APP_MOBILE_KEY: ${{ secrets.GREYD_APP_MOBILE_KEY }}
          # 구아키텍처 강제(2026-09-15) — RN 0.76은 미지정 시 New Architecture가 기본값이라 iOS만 새 아키텍처로
          # 컴파일돼 TestFlight 흰 화면. Podfile·eas.json에도 같은 값이 있지만 로컬 빌드 셸에도 명시한다.
          RCT_NEW_ARCH_ENABLED: "0"
        run: eas build --platform ios --profile production --local --non-interactive --output ${{ github.workspace }}/greyd.ipa

      - name: Submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform ios --profile production --path ${{ github.workspace }}/greyd.ipa --non-interactive

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greyd-ipa
          path: greyd.ipa
          if-no-files-found: ignore
